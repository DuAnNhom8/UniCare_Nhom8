<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu | UniCareer</title>
    <link rel="icon" href="../../assets/images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <script src="../../assets/js/site-ui.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container nav-wrap"><a class="brand" href="../../index.html"><span
                    class="brand-mark">U</span>UniCareer</a>
            <nav class="nav-main"><a href="../../index.html">Trang chủ</a><a href="../candidate/index.html">Việc làm</a>
            </nav>
            <div class="nav-side"><a class="btn btn-outline" href="login.html">Đăng nhập</a></div>
        </div>
    </header>
    <main class="page">
        <div class="container">
            <nav class="crumbs"><a href="../../index.html">Trang chủ</a><span>/</span><a href="login.html">Đăng
                    nhập</a><span>/</span><span class="current">Quên mật khẩu</span></nav>
            <section class="card auth-card auth-card--forgot">
                <div class="eyebrow">HỖ TRỢ TÀI KHOẢN</div>
                <h1>Quên mật khẩu?</h1>
                <p>Nhập email đã đăng ký để nhận hướng dẫn đặt lại mật khẩu.</p>
                <form action="#" method="get">
                    <div class="field"><label for="email">Email</label><input id="email" type="email"
                            autocomplete="email" placeholder="name@example.com" required></div><button
                        class="btn btn-lg btn-full" type="button" disabled>Gửi hướng dẫn</button>
                </form>
                <p class="auth-account-prompt"><a href="login.html">Quay lại đăng nhập</a></p>
                <p class="muted">Gửi email đặt lại mật khẩu chưa khả dụng trong bản demo.</p>
            </section>
        </div>
    </main>
    <footer class="site-footer">
        <div class="container footer-layout">
            <div><strong>UniCareer</strong>
                <p>Kết nối sinh viên với cơ hội nghề nghiệp.</p>
            </div>
        </div>
    </footer>
</body>

</html>
